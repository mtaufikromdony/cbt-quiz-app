services:
  cbt-quiz-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbt-quiz-app
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
